name: hid-msi test modules
on:
  push:
    branches: [claw-hidmsi-v4-test]
permissions:
  actions: read
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kernel-7.3.3-ogc1.90-fc45
          run-id: 43624700336
          github-token: ${{ github.token }}
          path: rpms
      - name: Install kernel-devel 7.3.3-ogc1.90
        run: |
          find rpms -name 'kernel-devel-7*.rpm' ! -name '*matched*'
          dnf install -y gcc make elfutils-libelf-devel kmod dwarves $(find rpms -name 'kernel-devel-7*.rpm' ! -name '*matched*')
      - name: Build
        run: |
          KDIR=/usr/src/kernels/7.3.3-ogc1.90.fc45.x86_64
          for v in v3 v4; do
            make -C $KDIR M=$PWD/hidmsi/$v W=1 modules 2>&1 | tee hidmsi/$v/build.log
            modinfo hidmsi/$v/hid-msi.ko | grep -E 'vermagic|srcversion'
          done
          ! grep -E "warning:|error:" hidmsi/v*/build.log | grep -v "pahole version"
          sha256sum hidmsi/v*/hid-msi.ko
      - uses: actions/upload-artifact@v4
        with:
          name: hid-msi-modules
          path: |
            hidmsi/v*/hid-msi.ko
            hidmsi/v*/build.log
